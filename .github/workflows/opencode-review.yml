
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/opencode') ||
      contains(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check OpenCode version
        run: |
          echo "Checking OpenCode version"
          curl -s https://api.github.com/repos/anomalyco/opencode/releases/latest \
            | grep -E 'tag_name|published_at'

      - name: Diagnose OpenCode configuration
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          echo "Checking API key..."
          if [ -n "$OPENCODE_API_KEY" ]; then
            echo "API KEY: PRESENT"
          else
            echo "API KEY: EMPTY"
          fi

          echo "Checking GitHub API..."
          curl -sS -o /tmp/release.json \
            -w "HTTP STATUS: %{http_code}\n" \
            https://api.github.com/repos/anomalyco/opencode/releases/latest

          cat /tmp/release.json

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/glm-5.3
          use_github_token: true
